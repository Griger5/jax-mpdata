[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-mpdata"
version = "0.0.1"
description = "Incoming Bachelor thesis"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "mpi4py",
    "mpi4jax", # TODO: mpi4jax breaks with build isolation
    "jax==0.11.2",
    "jaxlib==0.11.2"
]

[tool.setuptools.packages.find]
include = ["jax_mpdata*"]

[project.optional-dependencies]
benchmarks = [
    "xarray",
    "netCDF4",
    "PyMPDATA",
    "tqdm"
]
cuda = [
    "jax[cuda13]==0.11.2"
]