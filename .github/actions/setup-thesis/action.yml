name: "Setup environment"
description: "Setup Python and dependencies"
inputs:
  token:
    required: true
runs:
  using: "composite"
  steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter pyyaml

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Quarto Chrome headless shell
        shell: bash
        run: quarto install chrome-headless-shell

      - name: Install LaTeX rsvg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-luatex \
            texlive-bibtex-extra \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-lang-polish \
            texlive-music \
            texlive-extra-utils \
            texlive-science \
            librsvg2-bin \
            biber