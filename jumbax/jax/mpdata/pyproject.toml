[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-mpdata"
version = "0.0.1"
description = "Incoming Bachelor thesis"
requires-python = ">=3.9"
dependencies = [
    "mpi4py",
    "mpi4jax", # TODO: mpi4jax breaks with build isolation
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "jumbax-core>=0.0.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jax_mpdata*"]

[project.optional-dependencies]
cuda = [
    "jax[cuda13]==0.11.2"
]