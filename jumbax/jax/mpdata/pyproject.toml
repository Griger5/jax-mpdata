[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jumbax-mpdata-jax"
version = "0.0.1"
description = "JAX MPDATA backend"
requires-python = ">=3.9"
dependencies = [
    "jax>=0.11.1",
    "jaxlib>=0.11.1",
    "jumbax-core>=0.0.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jax_mpdata*"]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.11.1"]
cuda13 = ["jax[cuda13]>=0.11.1"]
mpi = [
    "mpi4py",
    "mpi4jax" # TODO: mpi4jax breaks with build isolation
]

[project.entry-points."jumbax.backends.mpdata"]
jax = "jax_mpdata.backend"