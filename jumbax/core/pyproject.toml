[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jumbax-core"
version = "0.0.1"
dependencies = [
    "types-array-api"
]

[tool.setuptools]
packages = ["jumbax_core", "jumbax_core.common", "jumbax_core.mpdata"]
package-dir = { jumbax_core = "." }